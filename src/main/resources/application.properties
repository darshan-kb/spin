#Postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/spindb
spring.datasource.url=jdbc:postgresql://192.168.1.16:5432/spindb
spring.datasource.username=postgres
spring.datasource.password=root

#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


server.port=8080
#jwksuri=http://localhost:8081/oauth2/jwks
jwksuri=http://auth/oauth2/jwks

#hibernate configuration
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

#cache
#spring.jpa.properties.hibernate.cache.use_second_level_cache=true
#spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory
#spring.jpa.properties.javax.persistence.sharedCache.mode=ENABLE_SELECTIVE

countdown=30
initcount=-30
drawCloseTime=10

#Spring mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.mvc.async.request-timeout=-1

#account URL
addURL=http://account/ticket/add
ticketErrorURL=http://localhost:7070/ticket/error
balanceURL=http://account/account/balance/
redeemClaimURL=http://account/claims